<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MyPaceMusic</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#000;}

.app-wrap{position:relative;width:100%;max-width:480px;aspect-ratio:1080/1920;}
.bg-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill;display:block;}
.dyn{position:absolute;}

/* START / STOP : 우상단 청록 사선 영역 */
#startBtn{left:78%;top:2.5%;width:22%;height:9%;background:transparent;border:none;
  font-family:"Arial Black",Arial,sans-serif;font-size:clamp(22px,6vw,42px);font-weight:900;
  color:white;cursor:pointer;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;letter-spacing:2px;}

/* BPM 숫자 : 원 중앙 ("Your Cadence is"와 "BPM" 사이) */
#bpmNum{left:29.5%;top:37.8%;width:40%;height:13.5%;
  font-family:"Arial Black",Arial,sans-serif;font-size:clamp(44px,15vw,118px);font-weight:900;
  color:rgba(255,255,255,0.55);display:flex;align-items:center;justify-content:center;letter-spacing:-2px;}

/* 측정 진행 바 : 원 안 "BPM" 글자 아래 */
#measureBar{left:39%;top:57.3%;width:21%;height:0.9%;background:rgba(255,255,255,0.25);
  border-radius:4px;overflow:hidden;display:none;}
#measureFill{height:100%;width:0%;background:#ffdd44;transition:width 0.25s ease;border-radius:4px;}

/* 걸음 수 : "TOTAL STEPS :" 오른쪽 */
#stepsVal{left:53%;top:71.7%;width:40%;height:5%;
  font-family:"Arial Black",Arial,sans-serif;font-size:clamp(26px,7vw,54px);font-weight:900;
  color:#a06060;display:flex;align-items:center;justify-content:flex-start;}

/* 곡명 5줄 : 하단 청록 띠 */

  display:flex;align-items:center;justify-content:center;text-transform:lowercase;white-space:nowrap;overflow:hidden;}

  display:flex;align-items:center;justify-content:center;text-transform:lowercase;white-space:nowrap;overflow:hidden;}
#np4{left:8%;top:94.1%;width:84%;height:3.2%;font-family:"Arial Black",Arial,sans-serif;
  font-size:clamp(12px,3.4vw,22px);font-weight:700;color:rgba(255,255,255,0.45);letter-spacing:1px;

/* 투명 터치 버튼 4개 */
#bpmUpBtn{left:30%;top:19.5%;width:44%;height:10%;background:transparent;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
#bpmDownBtn{left:30%;top:60.5%;width:44%;height:10%;background:transparent;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
#prevBtn{left:0%;top:39%;width:20%;height:20%;background:transparent;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
#nextBtn{left:80%;top:39%;width:20%;height:20%;background:transparent;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}

<body>
<div class="app-wrap">
  <img class="bg-img" id="bgImg" src="ui.png" alt="MyPaceMusic">
  <button class="dyn" id="startBtn" onclick="toggleSensor()">START</button>
  <div class="dyn" id="bpmNum">--</div>
  <div class="dyn" id="measureBar"><div id="measureFill"></div></div>
  <div class="dyn" id="stepsVal">0</div>
  <div class="dyn" id="np0"></div>
  <div class="dyn" id="np1"></div>
  <div class="dyn" id="np2"></div>
  <div class="dyn" id="np3"></div>
  <div class="dyn" id="np4"></div>
  <button class="dyn" id="bpmUpBtn" onclick="bpmStep(1)"></button>
  <button class="dyn" id="bpmDownBtn" onclick="bpmStep(-1)"></button>
  <button class="dyn" id="prevBtn" onclick="prevTrack()"></button>
  <button class="dyn" id="nextBtn" onclick="nextTrack()"></button>
</div>

<script>
// ── R2 스토리지 ───────────────────────────────────────────
var R2_BASE = "https://pub-c839bc8e4f8944b7bc78feb44003d00b.r2.dev";

var SONGS = {

  172: ["Flash Like This (Edit) (1).mp3","Maple - Dyalla.mp3","Photos Of Them - Freedom Trail Studio.mp3","Precious Girl - Ryan Stasik, Kanika Moore.mp3","Run Faster Than Yesterday (Edit) (2).mp3","Skyline Loop (Edit) (3).mp3","Slow Bloom (Edit) (4).mp3","Untitled (Edit) (41).mp3","Untitled (Edit) (7).mp3","trailer-sport-action-16203.mp3","trailer-sport-stylish-16073.mp3","zintius.mp3"],
  174: ["Cold Pizza in July (Edit).mp3","Drum Or Bass - Ryan Stasik.mp3","Flash Like This (Edit) (6).mp3","Glass on the Nightstand (Edit) (2).mp3","Midnight Vending Machine .mp3","Midnight Vending Machine Confessions (Edit).mp3","Slow Bloom (Edit) (2).mp3","Summer Dawn - Freedom Trail Studio.mp3","Take It Over - Ryan Stasik, Kanika Moore.mp3","Untitled (Edit) (17).mp3","Untitled (Edit) (33).mp3","Untitled (Edit) (40).mp3","Untitled (Edit) (46).mp3"],
  176: ["Flash Like This (Edit).mp3","Glass Between Us (Edit) (2).mp3","Jar of Green Buttons (Edit) (1).mp3","Mirrorball Freeway (Edit) (3).mp3","Run It Off (Edit) (1).mp3","Skyline Loop (Edit) (2).mp3","Summer Dawn.mp3","Take It Ove.mp3","The Shopping Cart Serenade .mp3","Untitled (Edit) (37).mp3","Untitled (Edit) (44).mp3","future-bass-hot-night-111447.mp3"],
  178: ["Broken Bottles, Open Throttle (Edit) (2).mp3","Cold Pizza in July (Edit) (1).mp3","Digital Dust Bunnies (Edit) (2).mp3","Digital Dust Bunnies (Edit).mp3","Mirrorball Freeway (Edit) (2).mp3","Run Faster Than Yesterday (Edit).mp3","Run It Off (Edit) (7).mp3","Slow Bloom (Edit) (7).mp3","The Last Clean Spoon (Edit).mp3","Untitled (Edit) (34).mp3","Untitled (Edit) (43).mp3"],
  180: ["All In - Everet Almond.mp3","Broken Bottles.mp3","Glass on the Nightstand (Edit) (4).mp3","Mirrorball Freeway (Edit) (1).mp3","Neon Run (Edit) (2).mp3","Run It Off (Edit).mp3","Skyline Loop (Edit) (1).mp3","Slow Bloom (Edit) (1).mp3","Sunlit Sidewalk Loop (Edit).mp3","Untitled (Edit) (36).mp3","Untitled (Edit) (39).mp3","Untitled (Edit) (42).mp3","cinematic-5-316221.mp3"]
};

// ── 설정 ──────────────────────────────────────────────────
var BPM_LIST = [150,152,154,156,158,160,162,164,166,168,170,172,174,176,178,180];
var STEPS_TO_LOCK = 20;   // 20걸음 누적 평균으로 무조건 확정
var CHANGE_THRESHOLD = 4; // 이 BPM 초과 차이나면 변화로 간주
var CHANGE_COUNT = 6;     // 연속 6발 감지되면 재측정 시작
var LOCK_GRACE_MS = 20000; // 확정 후 20초간 자동 재측정 무시 (보호 시간)
var MANUAL_HOLD_MS = 60000; // 수동 변경 후 1분간 자동 재측정 무시, 이후 자동 복귀

// 색상
var COLOR_IDLE   = "rgba(255,255,255,0.55)";
var COLOR_AUTO   = "#ffff00";  // 자동 확정 = 노랑
var COLOR_MANUAL = "#ff88cc";  // 수동 고정 = 분홍

// ── 유틸 ──────────────────────────────────────────────────
function getNearestBpm(b){
  return BPM_LIST.reduce(function(a,c){return Math.abs(c-b)<Math.abs(a-b)?c:a;});
}
function getDisplayTitle(filename){
  return filename
    .replace(/\.mp3$/i,'')
    .replace(/\s*\(Edit\)\s*/gi,' ')
    .replace(/\s*\(\d+\)\s*/g,' ')
    .replace(/-\d+$/,'')
    .replace(/_/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function getR2Url(bpm, filename){
  return R2_BASE + "/" + bpm + "/" + encodeURIComponent(filename);
}

// ── 상태 변수 ─────────────────────────────────────────────
var mode = "idle";         // idle / measuring / locked
var sensorActive = false;
var manualMode = false;    // 수동 BPM 고정 여부 (STOP→START로만 해제)
var stepCount = 0;
var lastStepTime = 0;
var motionHandler = null;
var demoTimer = null;
var currentTrackIdx = 0;
var currentAudio = null;
var lockedBpm = 0;

var measureSamples = [];   // 발자국별 BPM 누적
var changeBuffer = [];     // 연속 변화 감지 버퍼
var lockGraceUntil = 0;    // 이 시각 전까지는 자동 재측정 금지
var manualHoldUntil = 0;   // 수동 변경 보호 만료 시각

// ── UI 헬퍼 ───────────────────────────────────────────────
function setBpmDisplay(val, color){
  var el = document.getElementById("bpmNum");
  el.textContent = val;
  if(color) el.style.color = color;
}
function showBar(show){ document.getElementById("measureBar").style.display = show ? "block" : "none"; }
function setBar(p){ document.getElementById("measureFill").style.width = p + "%"; }
function clearNp(){ for(var i=0;i<5;i++) document.getElementById("np"+i).textContent=""; }

// ── 모드 전환 ─────────────────────────────────────────────
function enterMeasuring(seedSamples){
  mode = "measuring";
  measureSamples = seedSamples ? seedSamples.slice() : [];
  changeBuffer = [];
  // 재측정 중 음악 정지 (옛 곡에 몸이 동조하는 것을 방지)
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
  clearNp();
  showBar(true);
  updateMeasureUI();
}

function updateMeasureUI(){
  var n = measureSamples.length;
  setBar(Math.min((n / STEPS_TO_LOCK) * 100, 100));
  setBpmDisplay(n + "/" + STEPS_TO_LOCK, COLOR_IDLE);
}

function enterLocked(nearest, isManual){
  mode = "locked";
  lockedBpm = nearest;
  changeBuffer = [];
  manualMode = false; // 자동으로 다시 확정되면 수동 상태 해제
  lockGraceUntil = Date.now() + LOCK_GRACE_MS; // 확정 직후 20초간 흔들림 무시
  showBar(false);
  setBar(0);
  setBpmDisplay(nearest, isManual ? COLOR_MANUAL : COLOR_AUTO);
  currentTrackIdx = 0;
  renderNowPlaying(nearest);
  playTrack(nearest, 0);
}

// ── 발자국 BPM 처리 ───────────────────────────────────────
function onNewBpm(bpm){

  // ── MEASURING: 20걸음 채우면 평균으로 무조건 확정 ──
  if(mode === "measuring"){
    measureSamples.push(bpm);
    updateMeasureUI();
    if(measureSamples.length >= STEPS_TO_LOCK){
      var avg = Math.round(measureSamples.reduce(function(a,b){return a+b;},0) / measureSamples.length);
      enterLocked(getNearestBpm(avg), false);
    }
    return;
  }

  // ── LOCKED ──
  if(mode === "locked"){
    // 수동 변경 후 1분간은 사용자 의지 우선 — 그 후엔 자동 감지 복귀
    if(manualMode && Date.now() < manualHoldUntil){ changeBuffer = []; return; }

    // 확정 후 20초 보호 시간: 다른 케이던스가 잡혀도 무시
    if(Date.now() < lockGraceUntil){ changeBuffer = []; return; }

    if(Math.abs(bpm - lockedBpm) > CHANGE_THRESHOLD){
      changeBuffer.push(bpm);
      if(changeBuffer.length >= CHANGE_COUNT){
        // 연속 6발 감지 → 재측정 시작 (감지된 6발을 초기 샘플로 활용)
        enterMeasuring(changeBuffer);
      }
    } else {
      changeBuffer = []; // 일시적 흔들림 무시
    }
    return;
  }
}

// ── 수동 BPM 업/다운 ──────────────────────────────────────
function bpmStep(dir){
  if(mode !== "locked") return;
  var i = BPM_LIST.indexOf(lockedBpm) + dir;
  if(i < 0 || i >= BPM_LIST.length) return;
  manualMode = true;
  manualHoldUntil = Date.now() + MANUAL_HOLD_MS; // 누를 때마다 1분 보호 갱신
  enterLockedManual(BPM_LIST[i]);
}

function enterLockedManual(bpm){
  lockedBpm = bpm;
  changeBuffer = [];
  setBpmDisplay(bpm, COLOR_MANUAL);
  currentTrackIdx = 0;
  renderNowPlaying(bpm);
  playTrack(bpm, 0);
}

// ── 재생 ──────────────────────────────────────────────────
function renderNowPlaying(nearest){
  var tracks = SONGS[nearest] || [];
  var len = tracks.length;
  if(!len) return;
  for(var i=0;i<5;i++){
    var idx = (currentTrackIdx + i) % len;
    document.getElementById("np"+i).textContent = getDisplayTitle(tracks[idx]);
  }
}

function playTrack(nearest, idx){
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
  var tracks = SONGS[nearest] || [];
  if(!tracks.length) return;
  var file = tracks[idx % tracks.length];
  currentAudio = new Audio(getR2Url(nearest, file));
  currentAudio.play().catch(function(e){ console.log("Play error:", e); });
  currentAudio.onended = function(){
    currentTrackIdx++;
    if(lockedBpm){ renderNowPlaying(lockedBpm); playTrack(lockedBpm, currentTrackIdx); }
  };
}

function prevTrack(){
  if(mode !== "locked") return;
  if(currentTrackIdx > 0) currentTrackIdx--;
  renderNowPlaying(lockedBpm); playTrack(lockedBpm, currentTrackIdx);
}
function nextTrack(){
  if(mode !== "locked") return;
  currentTrackIdx++;
  renderNowPlaying(lockedBpm); playTrack(lockedBpm, currentTrackIdx);
}

// ── 센서 ──────────────────────────────────────────────────
function toggleSensor(){ if(!sensorActive) startSensor(); else stopSensor(); }

function startSensor(){
  if(typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function"){
    DeviceMotionEvent.requestPermission().then(function(s){
      if(s === "granted") activateMotion(); else startDemo();
    }).catch(function(){ startDemo(); });
  } else if(window.DeviceMotionEvent){
    activateMotion();
  } else {
    startDemo();
  }
}

function activateMotion(){
  sensorActive = true; manualMode = false; stepCount = 0;
  document.getElementById("stepsVal").textContent = "0";
  setBtn(true); enterMeasuring();
  var lastMag = 0, stepTimes = [];
  motionHandler = function(e){
    var a = e.accelerationIncludingGravity; if(!a) return;
    var mag = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z), now = Date.now();
    if(mag > 13 && lastMag <= 13 && (now - lastStepTime) > 220){
      lastStepTime = now; stepTimes.push(now); stepCount++;
      document.getElementById("stepsVal").textContent = stepCount;
      if(stepTimes.length > 8) stepTimes.shift();
      if(stepTimes.length >= 4){
        var ivs = [], s = 0;
        for(var i=1; i<stepTimes.length; i++) ivs.push(stepTimes[i]-stepTimes[i-1]);
        for(var j=0; j<ivs.length; j++) s += ivs[j];
        var bpm = Math.round(60000 / (s / ivs.length));
        if(bpm > 100 && bpm < 230) onNewBpm(bpm);
      }
    }
    lastMag = mag;
  };
  window.addEventListener("devicemotion", motionHandler);
}

function startDemo(){
  sensorActive = true; manualMode = false; stepCount = 0;
  document.getElementById("stepsVal").textContent = "0";
  setBtn(true); enterMeasuring();
  var d = 162;
  demoTimer = setInterval(function(){
    d = Math.max(150, Math.min(180, d + (Math.random() > 0.5 ? 0.5 : -0.5)));
    stepCount++; document.getElementById("stepsVal").textContent = stepCount;
    onNewBpm(Math.round(d));
  }, 400);
}

function stopSensor(){
  sensorActive = false; mode = "idle"; lockedBpm = 0; manualMode = false;
  measureSamples = []; changeBuffer = [];
  if(typeof motionHandler === "function") window.removeEventListener("devicemotion", motionHandler);
  if(demoTimer) clearInterval(demoTimer);
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
  motionHandler = null; demoTimer = null;
  setBtn(false);
  setBpmDisplay("--", COLOR_IDLE);
  showBar(false); setBar(0); clearNp();
}

function setBtn(on){
  var b = document.getElementById("startBtn");
  b.textContent = on ? "STOP" : "START";
  b.style.color = on ? "#ffdddd" : "white";
}
</script>
