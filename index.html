<script>
var DEMO_TRACKS = {
  150:["easy pace 150-1","easy pace 150-2","easy pace 150-3"],
  152:["steady flow 152-1","steady flow 152-2","steady flow 152-3"],
  154:["groove 154-1","groove 154-2","groove 154-3"],
  156:["rhythm 156-1","rhythm 156-2","rhythm 156-3"],
  158:["beat 158-1","beat 158-2","beat 158-3"],
  160:["energy 160-1","energy 160-2","energy 160-3"],
  162:["power 162-1","power 162-2","power 162-3"],

  166:["speed 166-1","speed 166-2","speed 166-3"],
  168:["rush 168-1","rush 168-2","rush 168-3"],
  170:["peak 170-1","peak 170-2","peak 170-3"],
  172:["force 172-1","force 172-2","force 172-3"],
  174:["sprint 174-1","sprint 174-2","sprint 174-3"],
  176:["blast 176-1","blast 176-2","blast 176-3"],
  178:["ultra 178-1","ultra 178-2","ultra 178-3"],
  180:["elite 180-1","elite 180-2","elite 180-3"]
};
var BPM_LIST=[150,152,154,156,158,160,162,164,166,168,170,172,174,176,178,180];
var DRIVE_FILES={};
var STABLE_SECONDS=7, STABLE_TOLERANCE=2, CHANGE_THRESHOLD=5, AVG_WINDOW=12;

function getNearestBpm(b){return BPM_LIST.reduce(function(a,c){return Math.abs(c-b)<Math.abs(a-b)?c:a;});}

var mode="idle", sensorActive=false, stepCount=0, lastStepTime=0;
var motionHandler=null, demoTimer=null;
var currentTrackIdx=0, currentAudio=null;
var bpmSamples=[], lockedBpm=0, stableStartTime=0;

function dbg(msg){
  document.getElementById("debug").textContent = 
    "MODE:"+mode+" | locked:"+lockedBpm+" | samples:"+bpmSamples.length+" | "+msg;
}

function setBpmDisplay(val){document.getElementById("bpmNum").textContent=val;}
function setLabel(t){document.getElementById("stabilizeLabel").textContent=t;}
function setBar(p){document.getElementById("stabilizeFill").style.width=p+"%";}

function onNewBpm(bpm){
  if(mode==="locked"){
    bpmSamples.push(bpm);
    if(bpmSamples.length>AVG_WINDOW) bpmSamples.shift();
    var avg=Math.round(bpmSamples.reduce(function(a,b){return a+b;},0)/bpmSamples.length);
    dbg("locked avg="+avg+" diff="+Math.abs(avg-lockedBpm));
    if(bpmSamples.length>=8 && Math.abs(avg-lockedBpm)>CHANGE_THRESHOLD){
      dbg("변화감지! -> measuring");
      enterMeasuring(avg);
    }
    return;
  }
  if(mode==="measuring"){
    bpmSamples.push(bpm);
    if(bpmSamples.length>AVG_WINDOW) bpmSamples.shift();
    var avg2=Math.round(bpmSamples.reduce(function(a,b){return a+b;},0)/bpmSamples.length);
    setBpmDisplay(avg2);
    checkStability(avg2);
    dbg("measuring avg="+avg2+" stable_t="+(stableStartTime>0?((Date.now()-stableStartTime)/1000).toFixed(1)+"s":"0"));
  }
}

function enterMeasuring(startVal){
  mode="measuring"; bpmSamples=[]; stableStartTime=0;
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  clearNp(); setBar(0); setLabel("케이던스 측정 중...");
  if(startVal) setBpmDisplay(startVal);
  dbg("enterMeasuring");
}

function checkStability(avg){
  if(bpmSamples.length<5){setLabel("케이던스 측정 중...");setBar(0);return;}
  var recent=bpmSamples.slice(-6);
  var stable=recent.every(function(x){return Math.abs(x-avg)<=STABLE_TOLERANCE;});
  if(stable){
    if(stableStartTime===0) stableStartTime=Date.now();
    var elapsed=(Date.now()-stableStartTime)/1000;
    setBar(Math.min(elapsed/STABLE_SECONDS*100,100));
    var rem=Math.ceil(STABLE_SECONDS-elapsed);
    setLabel(rem>0?("안정화 중... "+rem+"초"):"");
    if(elapsed>=STABLE_SECONDS) enterLocked(getNearestBpm(avg));
  } else {
    stableStartTime=0; setBar(0); setLabel("케이던스 측정 중...");
  }
}

function enterLocked(nearest){
  mode="locked"; lockedBpm=nearest; bpmSamples=[];
  setBpmDisplay(nearest);
  document.getElementById("bpmNum").style.color="#ffff00";
  setBar(0); setLabel("");
  renderTracks(nearest);
  dbg("LOCKED bpm="+nearest);
}

function renderTracks(nearest){
  var tracks=DEMO_TRACKS[nearest]||[];
  var len=tracks.length;
  for(var i=0;i<5;i++) document.getElementById("np"+i).textContent=tracks[(currentTrackIdx+i)%len]||"";
  if(DRIVE_FILES[nearest]&&DRIVE_FILES[nearest][currentTrackIdx%len]) playDrive(DRIVE_FILES[nearest][currentTrackIdx%len]);
}

function clearNp(){for(var i=0;i<5;i++) document.getElementById("np"+i).textContent="-- -- --";}

function playDrive(id){
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  currentAudio=new Audio("https://drive.google.com/uc?export=download&id="+id);
  currentAudio.play().catch(function(){});
  currentAudio.onended=function(){currentTrackIdx++;renderTracks(lockedBpm);};
}

function prevTrack(){if(currentTrackIdx>0){currentTrackIdx--;if(lockedBpm)renderTracks(lockedBpm);}}
function nextTrack(){currentTrackIdx++;if(lockedBpm)renderTracks(lockedBpm);}
function toggleSensor(){if(!sensorActive)startSensor();else stopSensor();}

function startSensor(){
  if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){
    DeviceMotionEvent.requestPermission().then(function(s){
      if(s==="granted") activateMotion(); else startDemo();
    }).catch(function(){startDemo();});
  } else if(window.DeviceMotionEvent){
    activateMotion();
  } else {
    startDemo();
  }
}

function activateMotion(){
  sensorActive=true; setBtn(true); enterMeasuring(null);
  dbg("실제 센서 활성화");
  var lastMag=0, stepTimes=[];
  motionHandler=function(e){
    var a=e.accelerationIncludingGravity; if(!a)return;
    var mag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z), now=Date.now();
    if(mag>13&&lastMag<=13&&(now-lastStepTime)>220){
      lastStepTime=now; stepTimes.push(now); stepCount++;
      document.getElementById("stepsVal").textContent=stepCount;
      if(stepTimes.length>8) stepTimes.shift();
      if(stepTimes.length>=4){
        var ivs=[],s=0;
        for(var i=1;i<stepTimes.length;i++) ivs.push(stepTimes[i]-stepTimes[i-1]);
        for(var j=0;j<ivs.length;j++) s+=ivs[j];
        var bpm=Math.round(60000/(s/ivs.length));
        if(bpm>100&&bpm<230) onNewBpm(bpm);
      }
    }
    lastMag=mag;
  };
  window.addEventListener("devicemotion",motionHandler);
}

function startDemo(){
  sensorActive=true; setBtn(true); enterMeasuring(null);
  dbg("데모모드");
  var d=162;
  demoTimer=setInterval(function(){
    d=Math.max(150,Math.min(180,d+(Math.random()>0.5?0.5:-0.5)));
    stepCount++; document.getElementById("stepsVal").textContent=stepCount;
    onNewBpm(Math.round(d));
  },500);
}

function stopSensor(){
  sensorActive=false; mode="idle"; lockedBpm=0;
  bpmSamples=[]; stableStartTime=0;
  if(typeof motionHandler==="function") window.removeEventListener("devicemotion",motionHandler);
  if(demoTimer) clearInterval(demoTimer);
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  motionHandler=null; demoTimer=null;
  setBtn(false); setBpmDisplay("--");
  document.getElementById("bpmNum").style.color="white";
  setBar(0); setLabel(""); clearNp();
  dbg("정지");
}

function setBtn(on){
  var b=document.getElementById("startBtn");
  b.textContent=on?"STOP":"GO";
  b.style.color=on?"#ffaaaa":"white";
}
</script>
</body>
