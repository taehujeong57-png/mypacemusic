<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MyPaceMusic</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:#E8EAEE;font-family:'Pretendard',-apple-system,sans-serif;
  display:flex;justify-content:center;min-height:100vh;overflow-x:hidden;}
.page{width:100%;max-width:420px;padding:28px 22px 30px;display:none;flex-direction:column;}
.page.on{display:flex;}
.raised{background:#EDEFF3;box-shadow:-4px -4px 10px #FFFFFF,4px 4px 10px #C9CDD6;border:none;}
.pressed{background:#EDEFF3;box-shadow:inset -3px -3px 7px #FFFFFF,inset 3px 3px 7px #D5D8DF;}
button{cursor:pointer;color:#3E4759;font-family:inherit;transition:box-shadow .12s;}
button:active{box-shadow:inset -3px -3px 7px #FFFFFF,inset 3px 3px 7px #D0D4DC;}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;}
.hdr .brand{font-size:15px;font-weight:600;color:#4A5268;letter-spacing:.5px;}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;}
.dial-outer{width:min(72vw,280px);height:min(72vw,280px);margin:0 auto;border-radius:50%;
  background:#EDEFF3;box-shadow:-12px -12px 26px #FFFFFF,12px 12px 26px #C4C8D2;
  display:flex;align-items:center;justify-content:center;}
.dial-inner{position:relative;width:87%;height:87%;border-radius:50%;background:#E8EAEE;
  box-shadow:inset -6px -6px 14px #FFFFFF,inset 6px 6px 14px #CDD1DA;}
.dial-inner svg{position:absolute;inset:0;width:100%;height:100%;}
.dial-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.dial-core{width:68%;height:68%;border-radius:50%;background:#EDEFF3;
  box-shadow:-6px -6px 14px #FFFFFF,6px 6px 14px #C9CDD6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;}
.num-row{display:flex;align-items:baseline;gap:4px;}
#bpmNum,#bpmNum2{font-size:clamp(38px,13vw,50px);font-weight:600;color:#3E4759;line-height:1;letter-spacing:-2px;}
#bpmHalf,#bpmHalf2{font-size:15px;color:#9BA0AC;font-weight:500;}
.unit{font-size:12px;color:#8A8F9C;margin-top:3px;letter-spacing:2px;}
.status{display:flex;align-items:center;gap:5px;margin-top:7px;}
.status i{width:7px;height:7px;border-radius:50%;background:#B7BCC8;display:inline-block;}
.status span{font-size:12px;color:#8A8F9C;font-weight:500;}
.song-card{border-radius:18px;padding:13px 16px;margin-top:26px;display:flex;align-items:center;gap:12px;}
.song-card .info{flex:1;min-width:0;}
.song-card .title{font-size:13px;font-weight:600;color:#9BA0AC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song-card .sub{font-size:11.5px;color:#9BA0AC;margin-top:1px;}
.song-card .steps{font-size:11.5px;color:#9BA0AC;white-space:nowrap;}
.note{color:#6E87E6;font-size:16px;}
.main-btn{width:100%;margin-top:22px;padding:16px;border-radius:18px;
  font-size:15px;font-weight:600;letter-spacing:3px;}
.stepper{display:flex;align-items:center;justify-content:center;gap:20px;margin:6px 0 4px;}
.step-btn{width:56px;height:56px;border-radius:50%;font-size:24px;font-weight:500;
  display:flex;align-items:center;justify-content:center;}
.stepper .mid{text-align:center;min-width:110px;}
.hint{font-size:11px;color:#9BA0AC;text-align:center;margin:8px 0 22px;}
.list{border-radius:18px;padding:6px 4px;}
.list .row{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13px;
  color:#9BA0AC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list .row.now{color:#3E4759;font-weight:600;}
.pn{display:flex;gap:12px;margin-top:20px;}
.pn button{flex:1;padding:14px;border-radius:16px;font-size:17px;}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:0 4px;}
.meta .k{font-size:13px;color:#8A8F9C;}
.meta .v{font-size:16px;font-weight:600;color:#3E4759;}
</style>
</head>
<body>

<!-- ═══ 1페이지 · 대문 ═══ -->
<div class="page on" id="page1">
  <div class="hdr">
    <span class="brand">MyPaceMusic</span>
    <button class="icon-btn raised" onclick="goPage(2)">&#9881;</button>
  </div>
  <div class="dial-outer" onclick="goPage(2)">
    <div class="dial-inner">
      <svg id="gaugeSvg" viewBox="0 0 226 226">
        <circle cx="113" cy="113" r="97" fill="none" stroke="#D6DAE1" stroke-width="11"/>
        <circle cx="113" cy="113" r="102.5" fill="none" stroke="#C8CCD5" stroke-width="0.8"/>
        <circle cx="113" cy="113" r="91.5" fill="none" stroke="#F6F8FB" stroke-width="0.8"/>
        <circle id="arc" cx="113" cy="113" r="97" fill="none" stroke="#6E87E6" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="609.5" stroke-dashoffset="609.5" transform="rotate(-90 113 113)"/>
        <circle id="dot" r="4.5" fill="#6E87E6" opacity="0"/>
        <g id="ticksG"></g>
      </svg>
      <div class="dial-center">
        <div class="dial-core">
          <div class="num-row"><span id="bpmNum">--</span><span id="bpmHalf"></span></div>
          <span class="unit">BPM</span>
          <div class="status"><i id="stDot"></i><span id="stTxt">대기</span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="song-card pressed">
    <span class="note">&#9835;</span>
    <div class="info">
      <div class="title" id="songTitle">대기 중</div>
      <div class="sub" id="songSub">START를 누르면 측정을 시작합니다</div>
    </div>
    <span class="steps" id="stepsVal1">0 걸음</span>
  </div>
  <button class="main-btn raised" id="startBtn" onclick="toggleSensor()">START</button>
</div>

<!-- ═══ 2페이지 · 상세 ═══ -->
<div class="page" id="page2">
  <div class="hdr">
    <button class="icon-btn raised" onclick="goPage(1)">&#8249;</button>
    <span class="brand">상세 설정</span>
    <span style="width:38px;"></span>
  </div>
  <div class="stepper">
    <button class="step-btn raised" onclick="bpmStep(-1)">&#8722;</button>
    <div class="mid">
      <div class="num-row" style="justify-content:center;"><span id="bpmNum2">--</span><span id="bpmHalf2"></span></div>
      <div class="status" style="justify-content:center;"><i id="stDot2"></i><span id="stTxt2">대기</span></div>
    </div>
    <button class="step-btn raised" onclick="bpmStep(1)">+</button>
  </div>
  <div class="hint">1 BPM 단위 정밀 조정 · 수동 변경 후 1분 뒤 자동 감지로 복귀</div>
  <div class="list pressed" id="npList">
    <div class="row" id="np0"></div>
    <div class="row" id="np1"></div>
    <div class="row" id="np2"></div>
    <div class="row" id="np3"></div>
    <div class="row" id="np4"></div>
  </div>
  <div class="pn">
    <button class="raised" onclick="prevTrack()">&#9198;</button>
    <button class="raised" onclick="nextTrack()">&#9197;</button>
  </div>
  <div class="meta"><span class="k">걸음 수</span><span class="v" id="stepsVal2">0</span></div>
</div>

<script>

var BPM_LIST = [150,152,154,156,158,160,162,164,166,168,170,172,174,176,178,180];
var STEPS_TO_LOCK = 10;
var CHANGE_THRESHOLD = 4;
var CHANGE_COUNT = 15;
var OUTLIER_BAND = 12;
var LOCK_GRACE_MS = 20000;
var MANUAL_HOLD_MS = 60000;

function median(arr){
  var s=arr.slice().sort(function(a,b){return a-b;});
  var m=Math.floor(s.length/2);
  return (s.length%2)?s[m]:(s[m-1]+s[m])/2;
}
function robustBpm(samples){
  var med=median(samples);
  var kept=samples.filter(function(b){return Math.abs(b-med)<=OUTLIER_BAND;});
  if(kept.length<3) return Math.round(med);
  var sum=kept.reduce(function(a,b){return a+b;},0);
  return Math.round(sum/kept.length);
}
function getNearestBpm(b){
  return BPM_LIST.reduce(function(a,c){return Math.abs(c-b)<Math.abs(a-b)?c:a;});
}
function getDisplayTitle(fn){
  return fn.replace(/\.mp3$/i,'').replace(/\s*\(Edit\)\s*/gi,' ')
    .replace(/\s*\(\d+\)\s*/g,' ').replace(/-\d+$/,'')
    .replace(/_/g,' ').replace(/\s+/g,' ').trim();
}
function getR2Url(bpm,fn){return R2_BASE+"/"+bpm+"/"+encodeURIComponent(fn);}

var mode="idle", sensorActive=false, manualMode=false;
var stepCount=0, lastStepTime=0, motionHandler=null, demoTimer=null;
var currentTrackIdx=0, currentAudio=null, lockedBpm=0;
var measureSamples=[], changeBuffer=[], lockGraceUntil=0, manualHoldUntil=0, stepTimes=[];

function enterMeasuring(){
  mode="measuring"; measureSamples=[]; changeBuffer=[]; stepTimes=[];
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  ui.measuringStart();
}
function enterLocked(nearest,isManual){
  mode="locked"; lockedBpm=nearest; changeBuffer=[]; manualMode=false;
  lockGraceUntil=Date.now()+LOCK_GRACE_MS;
  currentTrackIdx=0;
  ui.locked(nearest,isManual);
  renderNowPlaying(nearest);
  playTrack(nearest,0);
}
function feedBpm(bpm){
  if(mode==="measuring" && measureSamples.length>=3){
    var med=median(measureSamples);
    if(Math.abs(bpm-med)>OUTLIER_BAND) return;
  }
  onNewBpm(bpm);
}
function onNewBpm(bpm){
  if(mode==="measuring"){
    measureSamples.push(bpm);
    ui.measuringUpdate(measureSamples);
    if(measureSamples.length>=STEPS_TO_LOCK){
      enterLocked(getNearestBpm(robustBpm(measureSamples)),false);
    }
    return;
  }
  if(mode==="locked"){
    if(manualMode && Date.now()<manualHoldUntil){changeBuffer=[];return;}
    if(Date.now()<lockGraceUntil){changeBuffer=[];return;}
    if(Math.abs(bpm-lockedBpm)>CHANGE_THRESHOLD){
      changeBuffer.push(bpm);
      if(changeBuffer.length>=CHANGE_COUNT) enterMeasuring();
    } else {
      changeBuffer.splice(0,2);
    }
  }
}
function bpmStep(dir){
  if(mode!=="locked") return;
  var i=BPM_LIST.indexOf(lockedBpm)+dir;
  if(i<0||i>=BPM_LIST.length) return;
  manualMode=true;
  manualHoldUntil=Date.now()+MANUAL_HOLD_MS;
  enterLockedManual(BPM_LIST[i]);
}
function enterLockedManual(bpm){
  lockedBpm=bpm; changeBuffer=[]; currentTrackIdx=0;
  ui.locked(bpm,true);
  renderNowPlaying(bpm);
  playTrack(bpm,0);
}
function renderNowPlaying(nearest){
  var tracks=SONGS[nearest]||[], len=tracks.length;
  if(!len) return;
  for(var i=0;i<5;i++){
    var idx=(currentTrackIdx+i)%len;
    var el=document.getElementById("np"+i);
    el.textContent=(i===0?"▸ ":"")+getDisplayTitle(tracks[idx]);
    el.className="row"+(i===0?" now":"");
  }
  ui.setSong(getDisplayTitle(tracks[currentTrackIdx%len]),nearest,(currentTrackIdx%len)+1);
}
function playTrack(nearest,idx){
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  var tracks=SONGS[nearest]||[];
  if(!tracks.length) return;
  var file=tracks[idx%tracks.length];
  currentAudio=new Audio(getR2Url(nearest,file));
  currentAudio.play().catch(function(e){console.log("Play error:",e);});
  currentAudio.onended=function(){
    currentTrackIdx++;
    if(lockedBpm){renderNowPlaying(lockedBpm);playTrack(lockedBpm,currentTrackIdx);}
  };
}
function prevTrack(){
  if(mode!=="locked") return;
  if(currentTrackIdx>0) currentTrackIdx--;
  renderNowPlaying(lockedBpm); playTrack(lockedBpm,currentTrackIdx);
}
function nextTrack(){
  if(mode!=="locked") return;
  currentTrackIdx++;
  renderNowPlaying(lockedBpm); playTrack(lockedBpm,currentTrackIdx);
}
function toggleSensor(){ if(!sensorActive) startSensor(); else stopSensor(); }
function startSensor(){
  if(typeof DeviceMotionEvent!=="undefined" && typeof DeviceMotionEvent.requestPermission==="function"){
    DeviceMotionEvent.requestPermission().then(function(s){
      if(s==="granted") activateMotion(); else startDemo();
    }).catch(function(){startDemo();});
  } else if(window.DeviceMotionEvent){ activateMotion(); }
  else { startDemo(); }
}
function activateMotion(){
  sensorActive=true; manualMode=false; stepCount=0;
  ui.setSteps(0); ui.setBtn(true); enterMeasuring();
  var lastMag=0; stepTimes=[];
  motionHandler=function(e){
    var a=e.accelerationIncludingGravity; if(!a) return;
    var mag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z), now=Date.now();
    if(mag>13 && lastMag<=13 && (now-lastStepTime)>220){
      lastStepTime=now; stepTimes.push(now); stepCount++;
      ui.setSteps(stepCount);
      if(stepTimes.length>8) stepTimes.shift();
      if(stepTimes.length>=4){
        var ivs=[];
        for(var i=1;i<stepTimes.length;i++) ivs.push(stepTimes[i]-stepTimes[i-1]);
        var bpm=Math.round(60000/median(ivs));
        if(bpm>100 && bpm<230) feedBpm(bpm);
      }
    }
    lastMag=mag;
  };
  window.addEventListener("devicemotion",motionHandler);
}
function startDemo(){
  sensorActive=true; manualMode=false; stepCount=0;
  ui.setSteps(0); ui.setBtn(true); enterMeasuring();
  var d=162;
  demoTimer=setInterval(function(){
    d=Math.max(150,Math.min(180,d+(Math.random()>0.5?0.5:-0.5)));
    stepCount++; ui.setSteps(stepCount);
    onNewBpm(Math.round(d));
  },400);
}
function stopSensor(){
  sensorActive=false; mode="idle"; lockedBpm=0; manualMode=false;
  measureSamples=[]; changeBuffer=[];
  if(typeof motionHandler==="function") window.removeEventListener("devicemotion",motionHandler);
  if(demoTimer) clearInterval(demoTimer);
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  motionHandler=null; demoTimer=null;
  ui.idle();
}

// UI 레이어 (신규 — 뉴모피즘 계기판)
// ══════════════════════════════════════════════════════════
function goPage(n){
  document.getElementById("page1").classList.toggle("on",n===1);
  document.getElementById("page2").classList.toggle("on",n===2);
}

var ui=(function(){
  var ns="http://www.w3.org/2000/svg", C=609.5, cx=113, cy=113;
  var arc=document.getElementById("arc"), dot=document.getElementById("dot");
  var CB="#6E87E6", CA="#E0A030", CI="#B7BCC8";

  (function(){
    var g=document.getElementById("ticksG");
    function pt(r,ang){var a=(ang-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
    for(var b=100;b<200;b++){
      var ang=(b-100)*3.6, is10=b%10===0, is5=b%5===0;
      var p1=pt(is10?78:(is5?81:84),ang), p2=pt(87,ang);
      var l=document.createElementNS(ns,"line");
      l.setAttribute("x1",p1[0]);l.setAttribute("y1",p1[1]);
      l.setAttribute("x2",p2[0]);l.setAttribute("y2",p2[1]);
      l.setAttribute("stroke",is10?"#B7BCC8":"#D2D6DE");
      l.setAttribute("stroke-width",is10?"1.5":"0.8");
      l.setAttribute("stroke-linecap","round");
      g.appendChild(l);
    }
    var t=document.createElementNS(ns,"text");
    t.setAttribute("x",cx);t.setAttribute("y",34);
    t.setAttribute("text-anchor","middle");t.setAttribute("font-size","8.5");
    t.setAttribute("fill","#9BA0AC");t.setAttribute("font-family","inherit");
    t.textContent="100 · 200";
    g.appendChild(t);
  })();

  var cur=100, vel=0, target=null, raf=null, showHalf=false;
  function pt(r,ang){var a=(ang-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  function draw(){
    var frac=Math.max(0,Math.min(1,(cur-100)/100));
    arc.setAttribute("stroke-dashoffset",String(C*(1-frac)));
    var p=pt(97,frac*360);
    dot.setAttribute("cx",p[0]);dot.setAttribute("cy",p[1]);
    var n=Math.round(cur);
    setText("bpmNum",n);setText("bpmNum2",n);
    var h=(showHalf&&target!==null&&Math.abs(cur-target)<0.6)?"("+Math.round(target/2)+")":"";
    setText("bpmHalf",h);setText("bpmHalf2",h);
  }
  function loop(){
    vel=vel*0.86+(target-cur)*0.09;
    cur+=vel;
    draw();
    if(Math.abs(vel)>0.02||Math.abs(target-cur)>0.05){raf=requestAnimationFrame(loop);}
    else{cur=target;vel=0;draw();raf=null;}
  }
  function gaugeTo(bpm){
    target=bpm;
    if(!raf) raf=requestAnimationFrame(loop);
  }
  function setText(id,v){document.getElementById(id).textContent=v;}
  function setStatus(color,txt){
    ["stDot","stDot2"].forEach(function(id){document.getElementById(id).style.background=color;});
    ["stTxt","stTxt2"].forEach(function(id){
      var el=document.getElementById(id);el.textContent=txt;el.style.color=(color===CI?"#8A8F9C":color);
    });
  }

  return {
    idle:function(){
      if(raf)cancelAnimationFrame(raf);raf=null;
      cur=100;vel=0;target=null;showHalf=false;
      arc.setAttribute("stroke-dashoffset",String(C));
      dot.setAttribute("opacity","0");
      setText("bpmNum","--");setText("bpmNum2","--");
      setText("bpmHalf","");setText("bpmHalf2","");
      setStatus(CI,"대기");
      setText("songTitle","대기 중");
      document.getElementById("songTitle").style.color="#9BA0AC";
      setText("songSub","START를 누르면 측정을 시작합니다");
      for(var i=0;i<5;i++){var el=document.getElementById("np"+i);el.textContent="";el.className="row";}
      this.setBtn(false);
    },
    measuringStart:function(){
      showHalf=false;
      dot.setAttribute("opacity","1");
      arc.setAttribute("stroke",CA);dot.setAttribute("fill",CA);
      setStatus(CA,"측정 중 0/"+STEPS_TO_LOCK);
      setText("songTitle","측정 중 · 음악 일시 정지");
      document.getElementById("songTitle").style.color="#9BA0AC";
      setText("songSub","걸음 박자를 읽고 있습니다");
      cur=100;vel=0;gaugeTo(100);
    },
    measuringUpdate:function(samples){
      setStatus(CA,"측정 중 "+samples.length+"/"+STEPS_TO_LOCK);
      gaugeTo(median(samples));
    },
    locked:function(bpm,isManual){
      showHalf=true;
      var c=isManual?CA:CB;
      arc.setAttribute("stroke",c);dot.setAttribute("fill",c);dot.setAttribute("opacity","1");
      setStatus(c,isManual?"수동 고정":"자동 감지");
      gaugeTo(bpm);
    },
    setSong:function(title,bpm,trackNo){
      setText("songTitle",title);
      document.getElementById("songTitle").style.color="#4A5268";
      setText("songSub",bpm+" 폴더 · "+trackNo+"번째 곡");
    },
    setSteps:function(n){
      setText("stepsVal1",n.toLocaleString()+" 걸음");
      setText("stepsVal2",n.toLocaleString());
    },
    setBtn:function(on){
      document.getElementById("startBtn").textContent=on?"STOP":"START";
    }
  };
})();
ui.idle();
</script>
</body>
</html>
